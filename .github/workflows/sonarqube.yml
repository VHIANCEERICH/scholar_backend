name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate SonarQube configuration
        shell: bash
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::error title=Missing SONAR_TOKEN::Set repository secret SONAR_TOKEN."
            exit 1
          fi

          if [ -z "${SONAR_HOST_URL}" ]; then
            echo "::error title=Missing SONAR_HOST_URL::Set repository secret SONAR_HOST_URL (example: https://sonarqube.yourdomain.com)."
            exit 1
          fi

          case "${SONAR_HOST_URL}" in
            http://*|https://*)
              echo "SONAR_HOST_URL is valid: ${SONAR_HOST_URL}"
              ;;
            *)
              echo "::error title=Invalid SONAR_HOST_URL::SONAR_HOST_URL must start with http:// or https://. Current value: ${SONAR_HOST_URL}"
              exit 1
              ;;
          esac

          case "${SONAR_HOST_URL}" in
            */api/*)
              echo "::error title=Invalid SONAR_HOST_URL::Use the base server URL only (for example: https://sonarqube.yourdomain.com), not an API path. Current value: ${SONAR_HOST_URL}"
              exit 1
              ;;
          esac

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.host.url=${SONAR_HOST_URL}

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
