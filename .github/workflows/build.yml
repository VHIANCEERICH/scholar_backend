name: SonarQube

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_ENABLE: ${{ secrets.SONAR_ENABLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare SonarQube configuration
        id: sonar_config
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          run_scan=false
          scan_args="-Dsonar.projectBaseDir=."
          resolved_host="${SONAR_HOST_URL:-https://sonarcloud.io}"
          echo "Sonar event: ${EVENT_NAME} on ref: ${REF_NAME}"

          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::warning title=Missing SONAR_TOKEN::Skipping SonarCloud scan so the workflow can pass."
          elif [ -z "${SONAR_ORGANIZATION}" ]; then
            echo "::warning title=Missing SONAR_ORGANIZATION::Skipping SonarCloud scan so the workflow can pass."
          else
            run_scan=true
          fi

          if [ "${run_scan}" = "true" ]; then
            case "${resolved_host}" in
              http://*|https://*)
                echo "SONAR_HOST_URL is valid: ${resolved_host}"
                ;;
              *)
                echo "::error title=Invalid SONAR_HOST_URL::SONAR_HOST_URL must start with http:// or https://. Current value: ${resolved_host}"
                exit 1
                ;;
            esac

            case "${resolved_host}" in
              */api/*)
                echo "::error title=Invalid SONAR_HOST_URL::Use the base server URL only (for example: https://sonarqube.yourdomain.com), not an API path. Current value: ${resolved_host}"
                exit 1
                ;;
            esac

            if [ "${resolved_host}" = "https://sonarcloud.io" ]; then
              scan_args="${scan_args} -Dsonar.organization=${SONAR_ORGANIZATION}"
            fi

            if [ "${EVENT_NAME}" = "pull_request" ]; then
              scan_args="${scan_args} -Dsonar.pullrequest.key=${PR_NUMBER} -Dsonar.pullrequest.branch=${PR_HEAD_REF} -Dsonar.pullrequest.base=${PR_BASE_REF}"
            fi
          fi

          echo "SONAR_HOST_URL=${resolved_host}" >> "$GITHUB_ENV"
          echo "run_scan=${run_scan}" >> "$GITHUB_OUTPUT"
          echo "scan_args=${scan_args}" >> "$GITHUB_OUTPUT"

      - name: Set SonarCloud new code definition
        if: steps.sonar_config.outputs.run_scan == 'true' && github.event_name != 'pull_request' && env.SONAR_HOST_URL == 'https://sonarcloud.io'
        shell: bash
        run: |
          project_key="$(grep -E '^sonar\.projectKey=' sonar-project.properties | head -n 1 | cut -d= -f2-)"

          if [ -z "${project_key}" ]; then
            echo "::error title=Missing sonar.projectKey::Could not read sonar.projectKey from sonar-project.properties."
            exit 1
          fi

          curl -sSf -u "${SONAR_TOKEN}:" \
            -X POST "${SONAR_HOST_URL}/api/settings/set" \
            -d "component=${project_key}" \
            -d "key=sonar.leak.period" \
            -d "value=previous_version"

          curl -sSf -u "${SONAR_TOKEN}:" \
            -X POST "${SONAR_HOST_URL}/api/settings/set" \
            -d "component=${project_key}" \
            -d "key=sonar.leak.period.type" \
            -d "value=previous_version"

      - name: SonarQube Scan
        if: steps.sonar_config.outputs.run_scan == 'true'
        uses: sonarsource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          projectBaseDir: .
          args: ${{ steps.sonar_config.outputs.scan_args }}

      - name: SonarQube Quality Gate
        if: steps.sonar_config.outputs.run_scan == 'true' && github.event_name != 'pull_request'
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 10
