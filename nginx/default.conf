server {

    listen 80;

    # Change 'index.php' to your actual main file, like 'auth_login.php'

    index auth_login.php index.php index.html; 

    server_name localhost;

    root /var/www/html;



    location / {

        try_files $uri $uri/ /auth_login.php?$query_string;

    }



    location ~ \.php$ {

        include fastcgi_params;

        fastcgi_pass php:9000;

        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

    }

}